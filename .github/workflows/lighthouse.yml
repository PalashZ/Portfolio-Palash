name: Lighthouse-kontroll

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kör Lighthouse check
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://palashz.github.io/Portfolio-Palash/
          uploadartiFacts: true
          temporaryPublicStorage: true
          
